name: CI

on:
  push:
    branches: [main]
  pull_request:

# Privilegio minimo: los jobs solo leen el codigo y suben/bajan artifacts
# (que no dependen de este scope). Evita un GITHUB_TOKEN con permisos de escritura.
permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: ruff check backend
      - run: python -m pytest backend/tests -q

  # Cierra el hueco H-01 de docs/16_Testing.md: en SQLite `with_for_update()` es un
  # no-op, así que la concurrencia del sistema queda sin verificar. Este job levanta
  # un Postgres real, arma el esquema con las migraciones (de yapa cubre H-07, drift
  # de migraciones) y corre solo la suite de concurrencia (tests/concurrency).
  backend-tests-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: patitas_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["5432:5432"]
    env:
      # psycopg 3 (ver backend/requirements.txt): el driver es `postgresql+psycopg`,
      # no el `postgresql://` por defecto de SQLAlchemy (que apunta a psycopg2).
      # DATABASE_URL lo usa alembic para construir el esquema.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/patitas_test
      # CONCURRENCY_DATABASE_URL es la variable dedicada que leen los tests: separada de
      # DATABASE_URL a propósito, porque esos tests truncan todas las tablas y no deben
      # poder apuntar a una base real por accidente (la de test lleva "test" en el nombre).
      CONCURRENCY_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/patitas_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: alembic -c alembic.ini upgrade head
      - run: python -m pytest tests/concurrency -q

  contract-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: python backend/scripts/export_openapi.py
      - uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: backend/openapi.json

  frontend-tests:
    runs-on: ubuntu-latest
    needs: contract-schema
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: openapi-schema
          path: backend
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
      - run: npm ci
      - run: npm run gen:api-types
      # The generated types are committed so the frontend builds hermetically on
      # Vercel/Cloudflare. Fail if the committed file drifts from the backend
      # contract (i.e. someone changed the API without regenerating).
      - run: git diff --exit-code src/types/api.generated.ts
      - run: npm run lint
      - run: npm run build
      - run: npm test

  # --- Deploy gateado por el CI (desacople deploy/CI, docs/17 §2) --------------
  # El auto-deploy de Render y Vercel está apagado (render.yaml autoDeploy:false,
  # vercel.json git.deploymentEnabled.main:false). El deploy solo ocurre acá,
  # después de que los tests correspondientes pasan, y solo en push a main. Así un
  # push que rompe el CI ya no llega a producción.
  #
  # Cada job dispara un Deploy Hook del proveedor (URL con un token, guardada como
  # secret del repo). Si el secret aún no está cargado, el job SALE EN VERDE sin
  # desplegar: no rompe el CI durante la configuración.
  deploy-backend:
    runs-on: ubuntu-latest
    needs: [backend-tests, backend-tests-postgres, contract-schema]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Disparar deploy de Render
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "skipped: falta el secret RENDER_DEPLOY_HOOK_URL (deploy no disparado)"
            exit 0
          fi
          curl -fsS -X POST "$HOOK_URL" > /dev/null
          echo "deploy de Render disparado"

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [frontend-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Disparar deploy de Vercel
        env:
          HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "skipped: falta el secret VERCEL_DEPLOY_HOOK_URL (deploy no disparado)"
            exit 0
          fi
          curl -fsS -X POST "$HOOK_URL" > /dev/null
          echo "deploy de Vercel disparado"
