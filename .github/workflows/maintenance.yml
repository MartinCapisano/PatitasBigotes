name: Maintenance ping

# Drives the production maintenance jobs on the free-tier deployment.
# A single scheduled ping does triple duty:
#   1. runs one pass of every maintenance job (reconcile payments, reprocess
#      webhooks, expire stock reservations, sweep idempotency, prune tokens),
#   2. keeps the Render web service warm (it sleeps after ~15 min idle),
#   3. keeps the Supabase project active (it pauses after 7 days idle).
#
# Requires two repository secrets:
#   PROD_API_BASE_URL  -> e.g. https://patitasbigotes-api.onrender.com
#   MAINTENANCE_RUN_TOKEN -> same value set on the backend (see .env.production.example)

on:
  schedule:
    # Every ~13 minutes (under Render's 15-min idle window). GitHub may delay
    # scheduled runs under load; that is acceptable for maintenance.
    - cron: "*/13 * * * *"
  workflow_dispatch: {}

# Pega a un endpoint HTTP externo con un secret y, si falla, abre un issue de
# alerta (issues: write). No escribe código.
permissions:
  contents: read
  issues: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger maintenance run
        env:
          API_BASE_URL: ${{ secrets.PROD_API_BASE_URL }}
          MAINTENANCE_RUN_TOKEN: ${{ secrets.MAINTENANCE_RUN_TOKEN }}
        run: |
          if [ -z "$API_BASE_URL" ] || [ -z "$MAINTENANCE_RUN_TOKEN" ]; then
            # Prod no desplegada todavia: sin secrets no hay a quien pegarle.
            # Salir en verde para no spamear mails de fallo en cada corrida del
            # cron. El workflow se activa solo cuando se carguen ambos secrets.
            echo "skipped: not configured yet"
            exit 0
          fi
          # Capture body + HTTP code ourselves (no `curl -f`): run_all_maintenance
          # returns HTTP 200 with status "partial" when a job fails, and -f would
          # hide that. --max-time is generous to absorb Render's cold start (30-60s).
          body_file="$(mktemp)"
          http_code="$(curl -sS -o "$body_file" -w '%{http_code}' \
            -X POST "${API_BASE_URL%/}/internal/maintenance/run" \
            -H "Authorization: Bearer ${MAINTENANCE_RUN_TOKEN}" \
            --max-time 150)" || {
              echo "maintenance ping failed: transport error (timeout or cold start)" >&2
              exit 1
            }

          if [ "$http_code" -ge 400 ]; then
            echo "maintenance ping failed: HTTP $http_code" >&2
            cat "$body_file" >&2
            exit 1
          fi

          # run_all_maintenance() isolates each job and still answers 200; the real
          # signal is .data.status. partial => a job failed (mail); busy => two pings
          # overlapped, which is healthy; ok => all clear.
          run_status="$(jq -r '.data.status // "unknown"' "$body_file" 2>/dev/null || echo "unknown")"
          echo "maintenance run status: $run_status"
          case "$run_status" in
            ok|busy)
              exit 0
              ;;
            partial)
              echo "maintenance run reported partial failure" >&2
              cat "$body_file" >&2
              exit 1
              ;;
            *)
              echo "maintenance run reported unexpected status: $run_status" >&2
              cat "$body_file" >&2
              exit 1
              ;;
          esac

      # Alerta P0 (docs/17 §4.5): si la corrida falla, abrir un issue para que no
      # pase inadvertido. Mientras el mantenimiento esté caído se pierden en silencio
      # la reconciliación de pagos, el reprocesamiento de webhooks y la expiración de
      # reservas. No dispara en el "skipped" (ese sale en verde). Dedup por label: si
      # ya hay un issue abierto no se abre otro (el cron corre cada 13 min).
      - name: Abrir issue si el mantenimiento falla
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          label="maintenance-failure"
          # El label tiene que existir para poder filtrar/crear con él.
          gh label create "$label" --color B60205 \
            --description "El cron de mantenimiento esta fallando" 2>/dev/null || true
          open_issue="$(gh issue list --state open --label "$label" --limit 1 \
            --json number --jq '.[0].number // empty')"
          if [ -n "$open_issue" ]; then
            echo "ya hay un issue de alerta abierto (#$open_issue); no se abre otro"
            exit 0
          fi
          gh issue create --label "$label" \
            --title "🔴 El cron de mantenimiento esta fallando" \
            --body "$(printf 'El workflow **maintenance.yml** fallo.\n\nMientras este caido se pierden en silencio: reconciliacion de pagos, reprocesamiento de webhooks y expiracion de reservas de stock.\n\nCorrida que fallo: %s\n\nRevisa el backend y los secrets (PROD_API_BASE_URL, MAINTENANCE_RUN_TOKEN). Cerra este issue cuando el cron vuelva a correr en verde.' "$RUN_URL")"
